name: Build TWRP

on:
  push:
    branches:
      - A17
      - A14
      - twrp-fix-vendor-boot
  pull_request:
    branches:
      - A17
      - A14
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Prepare Build Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y git-core gnupg flex bison gperf build-essential zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses-dev libncurses5-dev libncurses5 x11proto-core-dev libx11-dev lib32z-dev libgl1-mesa-dev libxml2-utils xsltproc unzip python3 python3-pip repo

    - name: Configure Git
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"

    - name: Initialize TWRP Manifest
      run: |
        cd /tmp
        mkdir twrp
        cd twrp
        repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp -b twrp-12.1 --depth=1
        repo sync -j$(nproc --all) --force-sync

    - name: Add Device Tree
      run: |
        cd /tmp/twrp
        mkdir -p device/google/raven
        for file in $GITHUB_WORKSPACE/*; do
          if [ "$(basename "$file")" != ".git" ] && [ "$(basename "$file")" != "log" ] && [ "$(basename "$file")" != ".gitignore" ]; then
            cp -r "$file" device/google/raven/
          fi
        done
        ls -la device/google/raven/

    - name: Build TWRP (Pixel 6 Pro/raven/gs101: vendor_boot = recovery carrier)
      run: |
        cd /tmp/twrp
        ls -la device/google/
        ls -la device/google/raven/
        source build/envsetup.sh
        lunch twrp_raven-eng

        echo "=== Pixel 6 Pro (raven/gs101): TWRP recovery goes into VENDOR_BOOT partition ==="
        echo "=== Approach 1: mka vendorbootimage (PRIMARY target) ==="
        set +e
        mka vendorbootimage bootimage recoveryimage -j$(nproc --all)
        RC1=$?
        echo "Approach 1 exit code: $RC1"

        echo "=== Checking output after approach 1 ==="
        ls -la out/target/product/raven/*.img 2>/dev/null || echo "No .img files yet"

        echo "=== Approach 2: make vendorbootimage explicitly (fallback) ==="
        make vendorbootimage -j$(nproc --all) 2>&1 | tail -50
        RC2=$?
        echo "Approach 2 exit code: $RC2"

        echo "=== Checking output after approach 2 ==="
        ls -la out/target/product/raven/*.img 2>/dev/null || echo "Still no .img files"

        echo "=== Approach 3: build ALL image targets single-threaded (verbose) ==="
        make bootimage recoveryimage vendorbootimage vendor_boot boot recovery -j1 2>&1 | tail -80
        RC3=$?
        echo "Approach 3 exit code: $RC3"

        echo "=== Final output check ==="
        ls -la out/target/product/raven/*.img 2>/dev/null || echo "Still no .img files"

        set -e
        if [ -f out/target/product/raven/vendor_boot.img ]; then
          echo "SUCCESS: vendor_boot.img FOUND (PRIMARY TWRP recovery carrier for Pixel 6 Pro/gs101)"
        elif [ -f out/target/product/raven/boot.img ] || [ -f out/target/product/raven/recovery.img ]; then
          echo "SUCCESS: alternative image produced"
          [ -f out/target/product/raven/boot.img ] && echo "  -> boot.img present"
          [ -f out/target/product/raven/recovery.img ] && echo "  -> recovery.img present"
        else
          echo "ERROR: No image files produced. Dumping ninja target diagnostics..."
          echo "--- vendorbootimage ninja commands ---"
          ninja -f out/build-twrp_raven.ninja -t commands vendorbootimage 2>/dev/null | head -30 || echo "(unavailable)"
          echo "--- vendor_boot ninja commands ---"
          ninja -f out/build-twrp_raven.ninja -t commands vendor_boot 2>/dev/null | head -30 || echo "(unavailable)"
          echo "--- bootimage ninja commands ---"
          ninja -f out/build-twrp_raven.ninja -t commands bootimage 2>/dev/null | head -30 || echo "(unavailable)"
          echo "--- recoveryimage ninja commands ---"
          ninja -f out/build-twrp_raven.ninja -t commands recoveryimage 2>/dev/null | head -30 || echo "(unavailable)"
          echo "--- ALL ninja targets matching vendor|boot|recovery ---"
          ninja -f out/build-twrp_raven.ninja -t targets all 2>/dev/null | grep -iE 'vendor|boot|recovery' | head -40 || echo "(unavailable)"
        fi

    - name: Verify Build Output
      run: |
        cd /tmp/twrp
        echo "=== Output directory listing ==="
        ls -la out/target/product/raven/ 2>/dev/null || echo "ERROR: Product directory not found"
        echo ""
        echo "=== Image file sizes (critical: vendor_boot.img >20MB means TWRP is inside) ==="
        for img in out/target/product/raven/*.img; do
          if [ -f "$img" ]; then
            ls -lh "$img"
          fi
        done 2>/dev/null
        echo ""
        echo "=== All image files anywhere under out/ ==="
        find out/ -name "*.img" -type f 2>/dev/null | head -30 || echo "(none)"
        echo ""
        echo "=== Recovery ramdisk sbin search (verify recovery/twrp binaries) ==="
        for rd in \
          "out/target/product/raven/obj/PACKAGING/vendor_ramdisk_recovery_intermediates/vendor-ramdisk-by-name/vendor_ramdisk/recovery/root/sbin" \
          "out/target/product/raven/obj/PACKAGING/vendor_ramdisk_recovery_intermediates/root/sbin" \
          "out/target/product/raven/recovery/root/sbin" \
          "out/target/product/raven/obj/PACKAGING/recovery_intermediates/RECOVERY_ROOT/sbin"; do
          if [ -d "$rd" ]; then
            echo "--- Found sbin: $rd ---"
            ls -la "$rd" | head -20
            [ -f "$rd/recovery" ] && echo "  --> RECOVERY BINARY PRESENT"
            [ -f "$rd/twrp" ] && echo "  --> TWRP BINARY PRESENT"
          fi
        done

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: twrp-raven-vendor-boot
        path: |
          /tmp/twrp/out/target/product/raven/vendor_boot.img
          /tmp/twrp/out/target/product/raven/boot.img
          /tmp/twrp/out/target/product/raven/recovery.img
          /tmp/twrp/out/target/product/raven/vendor_dlkm.img
          /tmp/twrp/out/target/product/raven/dtbo.img
          /tmp/twrp/out/target/product/raven/vbmeta.img
          /tmp/twrp/out/target/product/raven/*.img
        if-no-files-found: error
        compression-level: 6
        retention-days: 30
